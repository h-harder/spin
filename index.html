<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin — your library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" class="disc-ring"/><circle cx="20" cy="20" r="4" class="disc-hole"/></svg>
      </span>
      <span class="brand-name">Spin</span>
    </div>

    <nav class="nav">
      <button class="nav-item is-active" data-view="library">Library</button>
      <button class="nav-item" data-view="artists">Artists</button>
      <button class="nav-item" data-view="albums">Albums</button>
    </nav>

    <div class="sidebar-status">
      <div class="status-row" id="connectionStatus">
        <span class="status-dot" id="connectionDot"></span>
        <span id="connectionLabel">Checking connection…</span>
      </div>
      <button class="btn-ghost" id="connectBtn">Connect Apple Music</button>
      <div class="sync-info">
        <div id="trackCounts">— tracks</div>
        <div id="lastSync">Never synced</div>
        <button class="btn-ghost small" id="syncBtn">Sync now</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="eyebrow" id="viewEyebrow">The stacks</div>
      <div class="search">
        <input type="text" id="searchInput" placeholder="Find a track, artist, or album…">
      </div>
    </header>

    <section class="content" id="content">
      <div class="empty-state" id="emptyState">
        <p class="empty-title">The shelf is empty.</p>
        <p class="empty-body">Connect your Apple Music account, then run a sync — your library will start filling in here as tracks finish downloading.</p>
      </div>
      <div class="track-grid" id="trackGrid" hidden></div>
    </section>
  </main>

</div>

<footer class="now-playing" id="nowPlaying" hidden>
  <div class="np-turntable" aria-hidden="true">
    <div class="np-disc" id="npDisc">
      <img id="npArt" alt="">
      <div class="np-label"></div>
    </div>
    <div class="np-tonearm" id="npTonearm">
      <div class="np-tonearm-head"></div>
    </div>
  </div>

  <div class="np-meta">
    <div class="np-title" id="npTitle">—</div>
    <div class="np-artist" id="npArtist">—</div>
  </div>

  <div class="np-controls">
    <button class="np-play" id="npPlayBtn" aria-label="Play">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="np-time">
      <span id="npCurrent">0:00</span>
      <div class="np-track-bar"><div class="np-track-fill" id="npFill"></div></div>
      <span id="npDuration">0:00</span>
    </div>
  </div>

  <audio id="audioEl" preload="none"></audio>
</footer>

<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
<script src="app.js"></script>
</body>
</html>
